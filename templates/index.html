<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MST</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 15px;
        }

        p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .status {
            text-align: center;
            padding: 15px;
            background: #e8f7ee;
            color: #16803c;
            border-radius: 10px;
            font-weight: bold;
        }

        .time {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">

            <h1>MST</h1>

            <p>Welcome to MST Web Service</p>

            <div class="status">
                ✓ Server is Live
            </div>

            <div class="time">
                <span id="time"></span>
            </div>

        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById("time").textContent =
                now.toLocaleString();
        }

        updateTime();
        setInterval(updateTime, 1000);
    </script>

</body>
</html>
